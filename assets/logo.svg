<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5FBA90"/>
      <stop offset="100%" style="stop-color:#2F7A57"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="200" height="200" rx="44" ry="44" fill="url(#bgGrad)"/>

  <!-- Gloss overlay -->
  <ellipse cx="80" cy="60" rx="80" ry="55" fill="url(#glowGrad)" opacity="0.6"/>

  <!-- Bar chart bars -->
  <!-- Left bar -->
  <rect x="38" y="102" width="36" height="62" rx="6" fill="rgba(255,255,255,0.65)"/>
  <!-- Center bar (tallest) -->
  <rect x="82" y="58" width="36" height="106" rx="6" fill="white"/>
  <!-- Right bar -->
  <rect x="126" y="76" width="36" height="88" rx="6" fill="rgba(255,255,255,0.82)"/>

  <!-- Baseline -->
  <rect x="30" y="170" width="140" height="5" rx="2.5" fill="rgba(255,255,255,0.35)"/>

  <!-- Trend line -->
  <polyline points="56,148 100,104 144,120"
    stroke="rgba(255,255,255,0.45)" stroke-width="4"
    stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Trend dot -->
  <circle cx="144" cy="120" r="5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="56" cy="148" r="5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="100" cy="104" r="5" fill="rgba(255,255,255,0.6)"/>
</svg>
