name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'        # fired automatically by bump-version.yml
  workflow_dispatch:    # also allows a manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-2022

    permissions:
      contents: write   # needed to create the GitHub Release and upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Warn if the placeholder (test) license key is still in use
        shell: bash
        run: |
          if grep -q "e5376d7d073b7c307dc4aade4243330a0915bd795e20b847a116e9501659273b" electron/services/license.service.ts; then
            echo "::warning title=Test license key::This build still uses the DEVELOPMENT public key whose private key was exposed in an earlier chat. Generate your own keypair (seller-tools/generate-license-key.js --new-keypair) and replace SELLER_PUBLIC_KEY_HEX before selling licenses."
          fi

      - name: Build and publish
        # publish:win chains `npm run build` (Vite + TypeScript compile)
        # before electron-builder — skipping straight to electron-builder
        # alone would package whatever happens to be in dist/, which is
        # empty or stale on a fresh CI checkout.
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          # Disable code signing — we don't have a certificate.
          # The installer still works; Windows SmartScreen may show a
          # one-time "unknown publisher" prompt that users click through.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
