name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'        # fired automatically by bump-version.yml
  workflow_dispatch:    # also allows a manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-2022

    permissions:
      contents: write   # needed to create the GitHub Release and upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Windows installer
        # --publish never  — we let softprops/action-gh-release upload the
        #   artifact in the next step.  Using --publish always here AND
        #   action-gh-release in the next step causes a race condition where
        #   electron-builder tries to create the release at the same time as
        #   the action, and one of them fails silently.
        run: npx electron-builder --win --x64 --publish never
        env:
          NODE_ENV: production
          # Disable code signing — we don't have a certificate.
          # The installer will still work; Windows SmartScreen may show a
          # one-time "unknown publisher" prompt that users click through.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
